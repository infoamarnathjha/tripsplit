/* TripSplit — warm-paper theme (light + dark), mobile-first, accessible */
:root{
  --font-sans:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;

  --bg:#f4efe7; --soft:#efe8dc; --panel:#fffdf9; --raised:#ffffff;
  --text:#1b1814; --muted:#726b62; --faint:#a99f92;
  --line:#e3d9cb; --line2:#efe7db;
  --accent:#1b6b48; --accent-ink:#f4faf6; --accent-soft:rgba(27,107,72,.10); --accent2:#c47a3a;
  --good:#1b6b48; --good-soft:rgba(27,107,72,.12);
  --bad:#b33925; --bad-soft:rgba(179,57,37,.10);
  --warn:#9a6416; --warn-soft:rgba(154,100,22,.14);
  --chip:#eee4d5; --hover:#efe7db; --panel-a:rgba(255,253,249,.90); --soft-a:rgba(244,239,231,.92);
  --r:20px; --r-sm:12px; --r-lg:26px;
  --shadow:0 1px 2px rgba(60,45,30,.06); --shadow-lg:0 22px 50px rgba(50,38,24,.22);
  --tap:44px; --nav-h:62px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#141210; --soft:#1a1714; --panel:#1d1915; --raised:#26211c;
  --text:#f5efe6; --muted:#a1978b; --faint:#6f665c;
  --line:#302a23; --line2:#241f1a;
  --accent:#34aa72; --accent-ink:#0a2517; --accent-soft:rgba(52,170,114,.16); --accent2:#e59654;
  --good:#34aa72; --good-soft:rgba(52,170,114,.16);
  --bad:#ea6450; --bad-soft:rgba(234,100,80,.14);
  --warn:#e59654; --warn-soft:rgba(229,150,84,.14);
  --chip:#2c251f; --hover:#2c251f; --panel-a:rgba(29,25,21,.90); --soft-a:rgba(20,18,16,.92);
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 22px 50px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background-color .2s ease,color .2s ease;
}
h1,h2,h3,.font-display{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.tnum{font-variant-numeric:tabular-nums}
.desktop-only{display:none!important}

/* scrollbars */
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

/* ---------- Shell ---------- */
.win{display:flex;flex-direction:column;min-height:100vh}
.sidebar{display:none}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--sat)) 16px 10px;
  background:var(--panel-a);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar .tripbtn{display:flex;align-items:center;gap:10px;background:transparent;border:0;padding:6px 6px;min-height:var(--tap);border-radius:14px;min-width:0}
.topbar .tripbtn:hover{background:var(--chip)}
.topbar h1{font-size:19px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw}
.topbar .sub{color:var(--muted);font-size:11.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .chev{color:var(--faint);display:inline-flex}
.spacer{flex:1}
.content{padding:16px 16px calc(96px + var(--sab));max-width:1040px;margin:0 auto;width:100%}
.brandmark{width:36px;height:36px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:0 0 auto}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:10px 15px;min-height:42px;border-radius:var(--r-sm);font-weight:600;color:var(--text);transition:background .15s,border-color .15s,transform .12s}
.btn:hover{background:var(--chip)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{background:var(--accent);filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--chip)}
.btn.danger{color:var(--bad);border-color:var(--line)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn.lg{min-height:var(--tap);font-size:15px;border-radius:14px}
.iconbtn{border:0;background:transparent;padding:8px;border-radius:12px;color:var(--muted);min-width:var(--tap);min-height:var(--tap);display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--chip);color:var(--text)}
.iconbtn svg{width:18px;height:18px}
.ic svg{width:19px;height:19px;display:block}
svg.lucide{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;flex:0 0 auto}

/* ---------- Cards / stats ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}
@media(min-width:620px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.stat .k{color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.stat .v{font-family:var(--font-display);font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* ---------- Lists ---------- */
.daygroup{margin:8px 0 2px;padding:6px 2px;display:flex;align-items:center;gap:8px}
.daygroup .d{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.daygroup .line{flex:1;height:1px;background:var(--line)}
.daygroup .sum{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line2);min-height:var(--tap)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;text-align:right}
.amt.big{font-size:16px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;color:var(--muted)}
.pill svg{width:12px;height:12px}
.pill.fund{background:var(--accent-soft);color:var(--accent)}
.pill.treat{background:var(--warn-soft);color:var(--warn)}
.pill.fx{background:var(--good-soft);color:var(--good)}
.avatar{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:0 0 auto}
.avatar svg{width:18px;height:18px;stroke:#fff}
.avatar.sm{width:28px;height:28px;font-size:11px;border-radius:10px}
.avatars{display:flex}
.avatars .avatar{margin-left:-8px;border:2px solid var(--panel)}
.avatars .avatar:first-child{margin-left:0}

/* ---------- Forms ---------- */
label.f{display:block;margin-bottom:12px}
label.f .lbl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.03em}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);outline:none;min-height:var(--tap)
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inline{display:flex;gap:10px;flex-wrap:wrap}
.inline>*{flex:1;min-width:130px}
.check{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:14px;min-height:var(--tap)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.seg{display:inline-flex;background:var(--chip);border-radius:14px;padding:4px;gap:2px;flex-wrap:wrap;width:100%}
.seg button{border:0;background:transparent;padding:9px 10px;border-radius:11px;font-weight:600;font-size:12.5px;color:var(--muted);flex:1;min-height:38px}
.seg button.active{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.hint{font-size:12.5px;color:var(--muted)}
.err{color:var(--bad);font-size:12.5px;font-weight:600}
.field-note{font-size:12px;color:var(--muted);margin-top:-6px;margin-bottom:10px}
code{background:var(--chip);padding:1px 6px;border-radius:6px;font-size:12px}

/* Chips (payer / member pickers) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 13px;min-height:40px;font-weight:600;font-size:13px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip.off{opacity:.5}
.chip .av{width:22px;height:22px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700}
.chip:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Table ---------- */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line2);font-size:13px}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- Empty / misc ---------- */
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty .big{margin-bottom:12px;display:flex;justify-content:center;color:var(--accent);opacity:.85}
.empty .big svg{width:42px;height:42px}
.empty h3{color:var(--text);margin:0 0 6px}
.center{text-align:center}
.chartwrap{display:grid;place-items:center}
svg text{font-family:var(--font-sans)}
.bar{height:9px;background:var(--chip);border-radius:999px;overflow:hidden;margin-top:5px}
.bar>span{display:block;height:100%;background:var(--accent)}
.bar.good>span{background:var(--good)}.bar.warn>span{background:var(--warn)}.bar.bad>span{background:var(--bad)}

/* ---------- Modal / sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(30,22,14,.42);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0;backdrop-filter:blur(3px)}
.modal{background:var(--raised);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;animation:sheet .2s ease}
@keyframes sheet{from{transform:translateY(12px)}to{transform:none}}
.modal .grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:8px auto 0}
.modal .mhead{position:sticky;top:0;background:var(--raised);display:flex;align-items:center;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line);z-index:2}
.modal .mhead h2{margin:0;font-size:17px}
.modal .mbody{padding:16px 20px}
.modal .mfoot{position:sticky;bottom:0;background:var(--raised);display:flex;gap:10px;padding:12px 20px calc(12px + var(--sab));border-top:1px solid var(--line)}
.modal .mfoot .btn{flex:1}
@media(min-width:640px){
  .overlay{align-items:center;padding:16px}
  .modal{border-radius:var(--r-lg);animation:pop .16s ease}
  @keyframes pop{from{transform:scale(.98)}to{transform:none}}
}
.amountfield{text-align:center;margin:6px 0 16px}
.amountfield .sym{color:var(--muted);font-size:22px;font-weight:700;vertical-align:middle}
.amountfield input{font-family:var(--font-display);font-size:40px;font-weight:700;letter-spacing:-.02em;text-align:center;border:0;background:transparent;padding:4px 0;font-variant-numeric:tabular-nums;min-height:auto}
.amountfield input:focus{box-shadow:none}
.splitbox{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;margin-top:6px}
.srow{display:flex;align-items:center;gap:10px;padding:6px 0}
.srow .grow{flex:1}
.srow input{max-width:120px}
.membersheet{display:flex;flex-direction:column;gap:2px}

/* ---------- Toast ---------- */
.toast{position:fixed;bottom:calc(var(--nav-h) + 16px + var(--sab));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;box-shadow:var(--shadow-lg);z-index:300;opacity:0;transition:opacity .2s,transform .2s;font-size:13px;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* ---------- Bottom nav + FAB (mobile) ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:var(--panel-a);backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sab));
}
.bottomnav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);font-size:10.5px;font-weight:600;border-radius:12px;min-height:var(--tap)}
.bottomnav button.active{color:var(--accent)}
.bottomnav .ic{display:grid;place-items:center}
.bottomnav .ic svg{width:20px;height:20px}
.fab{
  position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px + var(--sab));z-index:70;
  width:58px;height:58px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);
  box-shadow:var(--shadow-lg);display:grid;place-items:center;
}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.95)}

/* ---------- Desktop ---------- */
@media(min-width:900px){
  .win{flex-direction:row}
  .sidebar{
    display:flex;flex-direction:column;width:250px;flex:0 0 250px;background:var(--soft);
    border-right:1px solid var(--line);padding:14px 10px 14px;position:sticky;top:0;
    height:100vh;max-height:100vh;overflow-y:auto;overscroll-behavior:contain;
  }
  .traffic{display:flex;gap:7px;padding:4px 6px 14px}
  .dot{width:11px;height:11px;border-radius:50%}
  .dot.r{background:#e0705a}.dot.y{background:#e0b34a}.dot.g{background:#4fae74}
  .brand{font-family:var(--font-display);font-weight:700;font-size:17px;padding:2px 8px 2px;display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
  .brand .logo{width:32px;height:32px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
  .brand .logo svg{width:18px;height:18px}
  .brand .byline{display:block;font-family:var(--font-sans);font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--accent);text-transform:uppercase}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:10px}
  .nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:14px;color:var(--muted);font-weight:600;min-height:42px}
  .nav button:hover{background:var(--chip);color:var(--text)}
  .nav button.active{background:var(--accent-soft);color:var(--accent)}
  .nav .ico{display:grid;place-items:center}
  .nav .ico svg{width:18px;height:18px}
  .side-sep{height:1px;background:var(--line);margin:9px 6px}
  .side-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);padding:2px 11px 8px;font-weight:700}
  .trip-list{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
  .trip-list button{display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:9px 11px;border-radius:13px;text-align:left;width:100%;color:var(--muted);min-height:42px;font-weight:600}
  .trip-list button:hover{background:var(--chip);color:var(--text)}
  .trip-list button.active{background:var(--panel);color:var(--text);box-shadow:var(--shadow);border:1px solid var(--line)}
  .trip-list .emoji{display:grid;place-items:center}
  .trip-list .tname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:10px}
  .bottomnav{display:none}
  .fab{display:none}
  .content{padding:26px 28px 40px}
  .topbar{padding:14px 28px}
  .topbar h1{font-size:22px;max-width:none}
  .toast{bottom:24px}
  .mobile-only{display:none}
  .desktop-only{display:inline-flex!important}
}

@media(min-width:900px) and (max-height:700px){
  .sidebar{padding:10px 8px}
  .traffic{padding:2px 6px 8px}
  .brand{font-size:15px}
  .nav button{min-height:38px;padding:8px 10px}
  .trip-list button{min-height:38px;padding:8px 10px}
  .side-label{padding:0 11px 5px}
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ---------- Print (black on white, even in dark mode) ---------- */
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sidebar,.topbar,.no-print,.bottomnav,.fab,.mobile-only{display:none!important}
  .win{display:block;min-height:auto}
  .main{display:block}
  .content{max-width:none;padding:0}
  .card{box-shadow:none;border-color:#ddd!important;break-inside:avoid}
  body{background:#fff!important;color:#000!important}
  body,.card,.stat,.row,table,th,td,h1,h2,h3,.amt,.title,.meta,.k,.v,.hint,.pill,input,select,textarea,.brand,.daygroup .d,.daygroup .sum{color:#000!important;background:#fff!important}
  .pos{color:#0a6b2d!important}.neg{color:#a30000!important}
  .bar{background:#eee!important;border:1px solid #ccc}
}

/* ---------- Cover banner ---------- */
.cover{display:flex;align-items:center;gap:10px;border-radius:var(--r);padding:14px 18px;margin-bottom:14px;border:1px solid var(--line);box-shadow:var(--shadow);flex-wrap:wrap}
.cover-emoji{font-size:26px;line-height:1}
.cover-name{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.01em;color:#12301f;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.cover-sub{margin-left:auto;font-size:12px;font-weight:600;color:#2c4a38;opacity:.85}
[data-theme="dark"] .cover-name,[data-theme="dark"] .cover-sub{color:#f2efe9;text-shadow:0 1px 2px rgba(0,0,0,.5)}

/* ---------- Confetti ---------- */
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:999}

/* ---------- Subtle entrance (cards only, never long lists) ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* no entrance animation on cards: a paused animation must never hide content */

/* ---------- Login screen (macOS style) ---------- */
.loginscreen{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);position:relative;overflow:hidden;isolation:isolate}
.lgbg{position:absolute;inset:0;z-index:-1;overflow:hidden}
.lgbg .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:lgFloat 20s ease-in-out infinite;will-change:transform}
.lgbg .b1{width:46vmax;height:46vmax;background:var(--accent);top:-16vmax;left:-14vmax}
.lgbg .b2{width:40vmax;height:40vmax;background:var(--accent2);bottom:-18vmax;right:-12vmax;animation-duration:25s;animation-delay:-7s}
.lgbg .b3{width:30vmax;height:30vmax;background:#5aa9e6;top:34%;left:58%;opacity:.3;animation-duration:30s;animation-delay:-12s}
@keyframes lgFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(6vmax,4vmax) scale(1.12)}66%{transform:translate(-5vmax,7vmax) scale(.94)}}
.lgwrap{width:100%;max-width:410px;display:flex;flex-direction:column;align-items:center}
.logincard{width:100%;background:color-mix(in srgb,var(--panel) 74%,transparent);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid color-mix(in srgb,var(--line) 70%,#fff 30%);border-radius:22px;box-shadow:var(--shadow-lg),inset 0 1px 0 rgba(255,255,255,.35);overflow:hidden;animation:lgWinIn .8s cubic-bezier(.2,.9,.25,1.08) both}
@keyframes lgWinIn{0%{opacity:0;transform:translateY(34px) scale(.92)}100%{opacity:1;transform:none}}
.lgbar{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--soft) 60%,transparent)}
.lgdot{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18);transition:transform .2s}
.lgbar:hover .lgdot{transform:scale(1.12)}
.lgdot.r{background:#ff5f57}.lgdot.y{background:#febc2e}.lgdot.g{background:#28c840}
.lgtitle{flex:1;text-align:center;margin-right:44px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.lgbody{padding:26px 24px 24px}
.lgs{opacity:0;animation:lgRise .65s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0)*75ms + 280ms)}
@keyframes lgRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.loginbrand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:20px}
.loginlogo{width:64px;height:64px;border-radius:19px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.4);animation:lgLogo .9s cubic-bezier(.2,1.3,.3,1) .15s both,lgBob 4.5s ease-in-out 1.2s infinite}
.loginlogo svg{width:32px;height:32px}
@keyframes lgLogo{0%{opacity:0;transform:scale(.3) rotate(-14deg)}60%{opacity:1;transform:scale(1.14) rotate(4deg)}100%{opacity:1;transform:none}}
@keyframes lgBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.loginname{font-family:var(--font-display);font-weight:700;font-size:27px;letter-spacing:-.025em}
.loginby{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:linear-gradient(100deg,var(--accent) 20%,var(--accent2) 50%,var(--accent) 80%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;opacity:0;animation:lgRise .65s cubic-bezier(.2,.8,.2,1) .42s forwards,lgShimmer 4s linear infinite}
@keyframes lgShimmer{to{background-position:-220% 0}}
.logincard input{transition:box-shadow .2s,border-color .2s}
.logincard input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);outline:none}
.logincard .btn{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s,filter .2s}
.logincard .btn:hover{transform:translateY(-1px)}
.logincard .btn.primary:hover{box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 38%,transparent);filter:brightness(1.05)}
.logincard .btn:active{transform:scale(.97)}
.lgcredit{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}
.lgcredit b{color:var(--text)}
@media (prefers-reduced-motion:reduce){.logincard,.lgs,.loginlogo,.lgbg .blob,.loginby{animation:none!important;opacity:1!important}}
.rolepill{font-size:11px;font-weight:700;text-transform:capitalize;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}

.toast .undo{background:none;border:0;color:inherit;font:inherit;font-weight:800;text-decoration:underline;margin-left:12px;cursor:pointer;padding:0}

        var b2 = read();

      var bytes = [];

        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

            const label = v > 50 ? 'is owed' : (v < -50 ? 'owes' : 'settled');
            return `<div class="row"><div class="avatar" aria-hidden="true" style="background:${colorFor(m.id)}">${esc(initials(m.name))}</div>
              <div class="grow"><div class="title">${esc(m.name)}</div><div class="meta">${label}</div></div>
              <div class="amt ${cls}">${money(Math.abs(v), t.currency)}</div></div>`;
          }).join('')}
        </div>
      </div>
      <div class="card">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="margin:0">${balView === 'direct' ? 'Direct — who owes whom' : 'Settle up (minimum payments)'}</h3><div class="spacer"></div>
          ${can('settle') ? `<button class="btn sm" data-act="recordSettlement"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Record a payment</button>` : ''}</div>
        <div class="seg" style="margin:10px 0">
          <button class="${balView === 'simplified' ? 'active' : ''}" aria-pressed="${balView === 'simplified'}" data-act="setBalView" data-v="simplified">Fewest payments</button>
          <button class="${balView === 'direct' ? 'active' : ''}" aria-pressed="${balView === 'direct'}" data-act="setBalView" data-v="direct">Direct pairs</button>
        </div>
        ${(balView === 'direct' ? computeBilateral(t, asOf || undefined) : debts).length ? `<div style="margin-top:8px">${(balView === 'direct' ? computeBilateral(t, asOf || undefined) : debts).map(d => `<div class="row">
            <div class="grow"><div class="title">${esc(mname(t, d.from))} → ${esc(mname(t, d.to))}</div><div class="meta">pay this to settle</div></div>
            <div class="amt">${money(d.amount, t.currency)}</div>
            ${can('settle') ? `<button class="btn sm primary" data-act="upi" data-from="${d.from}" data-to="${d.to}" data-amt="${d.amount}">UPI</button>
            <button class="btn sm" data-act="markPaid" data-from="${d.from}" data-to="${d.to}" data-amt="${d.amount}">Mark paid</button>
            <button class="btn sm" data-act="shareRow" data-from="${d.from}" data-to="${d.to}" data-amt="${d.amount}">Share</button>` : ''}
          </div>`).join('')}</div>` : `<div class="empty" style="padding:22px"><div class="big"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-4"/></svg></div><p>${anyBal ? 'Nothing to settle between members.' : 'Everyone is settled up!'}</p></div>`}
      </div>
      ${ps ? `<div class="card"><h3>Group fund</h3>
        <div class="grid g3">
          <div class="stat"><div class="k">Collected</div><div class="v">${money(ps.contrib, t.currency)}</div></div>
          <div class="stat"><div class="k">Spent from fund</div><div class="v">${money(ps.spent, t.currency)}</div></div>
          <div class="stat"><div class="k">Remaining</div><div class="v ${ps.balance < 0 ? 'neg' : ''}">${money(ps.balance, t.currency)}</div></div>
        </div>${ps.balance < 0 ? '<p class="err" style="margin:10px 0 0">Group fund overspent — collect more from members.</p>' : ''}</div>` : ''}
      ${(t.settlements || []).filter(s => s.isSettled).length ? `<div class="card"><h3>Payment history</h3>
        ${(t.settlements || []).filter(s => s.isSettled).sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(s => `<div class="row">
          <div class="grow"><div class="title">${esc(mname(t, s.fromId))} paid ${esc(mname(t, s.toId))}</div><div class="meta">${esc(fmtDate(s.date))}${s.method ? ' · ' + esc(s.method) : ''}${s.upiRef ? ' · ' + esc(s.upiRef) : ''}${s.note ? ' · ' + esc(s.note) : ''}</div></div>
          <div class="amt">${money(s.amount, t.currency)}</div>
          ${role() === 'admin' ? `<button class="iconbtn" data-act="delSettlement" data-id="${s.id}" title="Undo"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></button>` : ''}</div>`).join('')}</div>` : ''}`;
  }

  // ---------------- Pool view ----------------
  function viewPool(t) {
    const ps = poolStatus(t);
    const perMember = {}; t.members.forEach(m => perMember[m.id] = 0);
    (t.poolContributions || []).forEach(c => perMember[c.memberId] = (perMember[c.memberId] || 0) + Math.round(c.amount));
    const target = t.poolTarget || 0;
    return `
      <div class="grid g3" style="margin-bottom:14px">
        <div class="stat"><div class="k">Total collected</div><div class="v">${money(ps.contrib, t.currency)}</div></div>
        <div class="stat"><div class="k">Spent from fund</div><div class="v">${money(ps.spent, t.currency)}</div></div>
        <div class="stat"><div class="k">Remaining</div><div class="v ${ps.balance < 0 ? 'neg' : ''}">${money(ps.balance, t.currency)}</div></div>
      </div>
      <div class="card">
        <div style="display:flex;align-items:center"><h3 style="margin:0">Contributions & pending</h3><div class="spacer"></div>
          <button class="btn sm primary" data-act="addContribution"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Add contribution</button></div>
        <div class="inline" style="margin-top:12px">
          <label class="f"><span class="lbl">Target per member (${esc(CUR[t.currency] || t.currency)})</span><input type="number" id="poolTargetInput" value="${target ? target / 100 : ''}" placeholder="e.g. 3000"></label>
          <p class="hint" style="margin-top:4px">Changing the target does not affect contributions already paid.</p>
          <label class="f"><span class="lbl">Fund held by</span><select id="poolHolderSel"><option value="">— not set —</option>${liveMembers(t).map(m => `<option value="${m.id}" ${m.id === t.poolHolderId ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></label>
          <label class="f" style="flex:0 0 auto;display:flex;align-items:flex-end"><button class="btn primary" data-act="savePoolSettings">Save</button></label>
        </div>
        <div style="margin-top:8px">
        ${liveMembers(t).map(m => { const paid = perMember[m.id] || 0; const due = target ? Math.max(0, target - paid) : 0;
          return `<div class="row"><div class="avatar" aria-hidden="true" style="background:${colorFor(m.id)}">${esc(initials(m.name))}</div>
            <div class="grow"><div class="title">${esc(m.name)}</div><div class="meta">${target ? (due > 0 ? `Pending ${money(due, t.currency)}` : 'Fully paid ✓') : 'contributed'}</div></div>
            <div class="amt">${money(paid, t.currency)}</div></div>`; }).join('')}
        </div>
      </div>
      <div class="card"><h3>Contribution log</h3>
        ${(t.poolContributions || []).length ? (t.poolContributions || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(c => `<div class="row">
          <div class="grow"><div class="title">${esc(mname(t, c.memberId))}</div><div class="meta">${esc(fmtDate(c.date))}${c.note ? ' · ' + esc(c.note) : ''}</div></div>
          <div class="amt">${money(c.amount, t.currency)}</div>
          ${role() === 'admin' ? `<button class="iconbtn" data-act="delContribution" data-id="${c.id}"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>` : ''}</div>`).join('') : '<div class="hint">No contributions yet.</div>'}
      </div>`;
  }

  // ---------------- Recurring view ----------------
  function viewRecurring(t) {
    const list = t.recurring || [];
    return `<div class="card"><div style="display:flex;align-items:center"><h3 style="margin:0">Repeats</h3><div class="spacer"></div><button class="btn sm primary" data-act="newRecurring"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Add repeat</button></div>
      <p class="hint" style="margin:8px 0">Auto-added to the trip when due (rent, subscriptions, daily hotel, etc.). A due item is created once its date arrives.</p>
      ${list.length ? list.map(r => `<div class="row"><div class="avatar" aria-hidden="true" style="background:${colorFor(r.categoryId || 'misc')}">${catIcon(r.categoryId)}</div>
        <div class="grow"><div class="title">${esc(r.title)}</div><div class="meta">${money(r.amount, r.currency || t.currency)} · ${esc(r.freq)} · next ${esc(fmtDate(r.nextDate))}${r.fromPool ? ' · fund' : ''}${r.isTreat ? ' · treat' : ''}${r.paused ? ' · <span class="pill">paused</span>' : ''}</div></div>
        <button class="iconbtn" data-act="pauseRecurring" data-id="${r.id}" title="${r.paused ? 'Resume' : 'Pause'}" aria-label="${r.paused ? 'Resume' : 'Pause'} repeat">${r.paused ? ic('repeat') : ic('hourglass')}</button><button class="iconbtn" data-act="skipRecurring" data-id="${r.id}" title="Skip next" aria-label="Skip next">${ic('down')}</button>
        <button class="iconbtn" data-act="editRecurring" data-id="${r.id}"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>${role() === 'admin' ? `<button class="iconbtn" data-act="delRecurring" data-id="${r.id}"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>` : ''}</div>`).join('') : '<div class="empty" style="padding:26px"><div class="big"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></div><p>No repeats yet.</p></div>'}
    </div>`;
  }

  // ---------------- Members view ----------------
  function viewMembers(t) {
    return `<div class="card">
      <div style="display:flex;align-items:center"><h3 style="margin:0">Travellers</h3><div class="spacer"></div>
        <button class="btn sm primary" data-act="newMember"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Add traveller</button></div>
      <div style="margin-top:8px">
        ${liveMembers(t).map(m => `<div class="row">
          <div class="avatar" aria-hidden="true" style="background:${colorFor(m.id)}">${esc(initials(m.name))}</div>
          <div class="grow"><div class="title">${esc(m.name)}${m.guest ? ' <span class="pill">Guest</span>' : ''}</div>
            <div class="meta">${m.email ? esc(m.email) + ' · ' : ''}${m.phone ? esc(m.phone) + ' · ' : ''}${m.upiId ? 'UPI: ' + esc(m.upiId) + ' · ' : ''}${m.joinedOn || m.leftOn ? `active ${m.joinedOn ? fmtDate(m.joinedOn) : 'start'} → ${m.leftOn ? fmtDate(m.leftOn) : 'end'}` : 'full trip'}</div></div>
          <button class="iconbtn" data-act="editMember" data-id="${m.id}"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          ${role() === 'admin' ? `<button class="iconbtn" data-act="delMember" data-id="${m.id}"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>` : ''}
        </div>`).join('') || '<div class="hint">No travellers yet.</div>'}
        ${t.members.filter(m => m.deleted).length ? `<div class="side-sep" style="margin:14px 0"></div><div class="hint" style="margin-bottom:6px">Removed travellers (kept in history)</div>${t.members.filter(m => m.deleted).map(m => `<div class="row"><div class="avatar" aria-hidden="true" style="background:var(--faint)">${esc(initials(m.name))}</div><div class="grow"><div class="title" style="color:var(--muted)">${esc(m.name)}</div><div class="meta">removed</div></div>${role() === 'admin' ? `<button class="iconbtn" data-act="restoreMember" data-id="${m.id}" title="Restore" aria-label="Restore ${esc(m.name)}">${ic('rotate')}</button><button class="iconbtn" data-act="purgeMember" data-id="${m.id}" title="Erase permanently" aria-label="Erase ${esc(m.name)} permanently">${ic('trash')}</button>` : ''}</div>`).join('')}` : ''}
      </div></div>
      <div class="card"><h3>Journey settings</h3>
        <div class="inline">
          <label class="f"><span class="lbl">Journey name</span><input type="text" id="tripName" value="${esc(t.name)}"></label>
          <label class="f"><span class="lbl">Place (optional)</span><input type="text" id="tripPlace" value="${esc(t.place || '')}" placeholder="e.g. Anjuna & Vagator, Goa"></label>
          <label class="f"><span class="lbl">Currency</span><select id="tripCur">${Object.keys(CUR).map(c => `<option ${c === t.currency ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
        </div>
        <div class="inline">
          <label class="f"><span class="lbl">Start</span><input type="date" id="tripStart" value="${esc(t.startDate || '')}"></label>
          <label class="f"><span class="lbl">End</span><input type="date" id="tripEnd" value="${esc(t.endDate || '')}"></label>
        </div>
        <div class="inline">
          <label class="f"><span class="lbl">Cover theme</span><select id="tripCover">${COVERS.map(c => `<option value="${c.id}" ${(t.coverPreset || 'paper') === c.id ? 'selected' : ''}>${c.label}</option>`).join('')}</select></label>
          <label class="f"><span class="lbl">Cover emoji</span><input type="text" id="tripEmoji" value="${esc(t.coverEmoji || '🧳')}" maxlength="4"></label>
        </div>
        <label class="check"><input type="checkbox" id="tripPool" ${t.poolEnabled ? 'checked' : ''}> Enable common fund / pool for this trip</label>
        <label class="f"><span class="lbl">Default split for new expenses</span><select id="tripDefSplit">${[['equal', 'Equally'], ['exact', 'Exact amounts'], ['percent', 'By %'], ['weight', 'By shares'], ['item', 'Itemised']].map(([v, l]) => `<option value="${v}" ${(t.defaultSplit && t.defaultSplit.mode) === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap">${can('manage') ? `<button class="btn primary" data-act="saveTripSettings">Save settings</button>
        <button class="btn" data-act="saveTemplate">Save as template</button>
        <button class="btn danger" data-act="delTrip">Delete journey</button>` : '<span class="hint">Only the admin can change journey settings.</span>'}</div>
      </div>`;
  }

  // ---------------- Reports view ----------------
  function viewReports(t) {
    const bal = computeBalances(t);
    const debts = simplify(bal);
    const cat = categoryTotals(t); const catArr = Object.keys(cat).map(id => ({ id, name: catById(id).name, value: cat[id] })).sort((a, b) => b.value - a.value);
    const total = totalSpend(t);
    const perDay = {}; (t.expenses || []).forEach(e => { if (e.isTreat || e.deleted) return; perDay[e.date] = (perDay[e.date] || 0) + expBaseAmount(e); });
    const days = Object.keys(perDay).sort();
    const paidBy = {}; t.members.forEach(m => paidBy[m.id] = 0);
    (t.expenses || []).forEach(e => { if (e.isTreat || e.deleted) return; if (e.fromPool) return; (e.payers || []).forEach(p => paidBy[p.memberId] = (paidBy[p.memberId] || 0) + Math.round(p.amount * expRate(e))); });
    const shareBy = {}; t.members.forEach(m => shareBy[m.id] = 0);
    (t.expenses || []).forEach(e => { if (e.isTreat || e.deleted) return; const s = computeSharesBase(e); Object.keys(s).forEach(id => shareBy[id] = (shareBy[id] || 0) + s[id]); });
    return `
      <div class="card">
        <div style="display:flex;align-items:center"><h3 style="margin:0">Trip summary</h3><div class="spacer"></div>
          <button class="btn sm" data-act="printReport"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Print / PDF</button>
          <button class="btn sm" data-act="whatsappCard"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg> Share card</button>
          <button class="btn sm" data-act="exportCSV"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M19 12l-7 7-7-7"/></svg> CSV</button></div>
        <div class="grid g4" style="margin-top:10px">
          <div class="stat"><div class="k">Total spent</div><div class="v">${money(total, t.currency)}</div></div>
          <div class="stat"><div class="k">Members</div><div class="v">${t.members.length}</div></div>
          <div class="stat"><div class="k">Expenses</div><div class="v">${(t.expenses || []).length}</div></div>
          <div class="stat"><div class="k">Avg / person</div><div class="v">${money(t.members.length ? Math.round(total / t.members.length) : 0, t.currency)}</div></div>
        </div>
      </div>
      ${(() => { const bs = budgetStatus(t); if (!bs.budget && !bs.cats.length) return `<div class="card"><div style="display:flex;align-items:center"><h3 style="margin:0">Budget</h3><div class="spacer"></div>${can('manage') ? `<button class="btn sm" data-act="setBudget">Set budget</button>` : ''}</div><p class="hint" style="margin:8px 0 0">No budget set. Add a journey budget and per-category limits to get alerts.</p></div>`; const pct = bs.budget ? Math.round(bs.total / bs.budget * 100) : 0; return `<div class="card"><div style="display:flex;align-items:center"><h3 style="margin:0">Budget</h3><div class="spacer"></div>${can('manage') ? `<button class="btn sm" data-act="setBudget">Edit budget</button>` : ''}</div>${bs.budget ? `<div style="margin:10px 0 4px"><div style="display:flex;justify-content:space-between"><b>${money(bs.total, t.currency)}</b><span class="hint">of ${money(bs.budget, t.currency)} · ${pct}%</span></div><div style="height:10px;background:var(--chip);border-radius:999px;overflow:hidden;margin-top:5px"><div style="height:100%;width:${Math.min(100, pct)}%;background:${pct >= 100 ? 'var(--bad)' : pct >= 80 ? 'var(--warn)' : 'var(--good)'}"></div></div>${pct >= 100 ? '<p class="err" style="margin:6px 0 0">Budget exceeded!</p>' : ''}${bs.daily ? '<p class="hint" style="margin:6px 0 0">≈ ' + money(bs.daily, t.currency) + ' per day over ' + bs.days + ' day' + (bs.days === 1 ? '' : 's') + '</p>' : ''}</div>` : ''}${bs.cats.map(c => { const p = Math.round(c.spent / c.limit * 100); return `<div style="margin:10px 0 4px"><div style="display:flex;justify-content:space-between"><span>${c.icon} ${esc(c.name)}</span><span class="hint">${money(c.spent, t.currency)} / ${money(c.limit, t.currency)} · ${p}%</span></div><div style="height:8px;background:var(--chip);border-radius:999px;overflow:hidden;margin-top:4px"><div style="height:100%;width:${Math.min(100, p)}%;background:${p >= 100 ? 'var(--bad)' : p >= 80 ? 'var(--warn)' : 'var(--good)'}"></div></div></div>`; }).join('')}</div>`; })()}
      <div class="grid g2">
        <div class="card"><h3>Spend by category</h3>
          ${catArr.length ? `<div class="chartwrap">${pieSVG(catArr.map((c, i) => ({ label: c.name, value: c.value, color: PALETTE[i % PALETTE.length] })))}</div>
          <table style="margin-top:8px">${catArr.map((c, i) => `<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${PALETTE[i % PALETTE.length]};margin-right:7px"></span>${esc(c.name)}</td><td class="num">${money(c.value, t.currency)}</td><td class="num">${total ? Math.round(c.value / total * 100) : 0}%</td></tr>`).join('')}</table>` : '<div class="hint">No expenses.</div>'}
        </div>
        <div class="card"><h3>Paid vs share (per person)</h3><p class="hint" style="margin:-6px 0 8px">Net includes the group fund and recorded settlements.</p>
          <div class="chartwrap">${barSVG(t.members.map(m => ({ label: m.name, value: paidBy[m.id] || 0 })))}</div>
          <table style="margin-top:8px"><tr><th>Member</th><th class="num">Paid</th><th class="num">Share</th><th class="num">Net</th></tr>
          ${t.members.map(m => { const net = bal[m.id] || 0; return `<tr><td>${esc(m.name)}</td><td class="num">${money(paidBy[m.id] || 0, t.currency)}</td><td class="num">${money(shareBy[m.id] || 0, t.currency)}</td><td class="num ${net > 50 ? 'pos' : net < -50 ? 'neg' : ''}">${money(net, t.currency)}</td></tr>`; }).join('')}</table>
        </div>
      </div>
      ${days.length > 1 ? `<div class="card"><h3>Spend over time</h3><div class="chartwrap">${lineSVG(days.map(d => ({ label: d, value: perDay[d] })))}</div></div>` : ''}
      <div class="card"><h3>Per person</h3>
        <div class="tablewrap"><table><tr><th>Member</th><th class="num">Paid</th><th class="num">Share</th><th class="num">Net</th><th class="num">Treats given</th><th class="num">Treats got</th></tr>
        ${t.members.filter(m => !m.deleted).map(m => { const tg = (t.expenses || []).filter(e => e.isTreat && !e.deleted && (e.payers || []).some(p => p.memberId === m.id)).reduce((a, e) => a + expBaseAmount(e), 0); const tr = (t.expenses || []).filter(e => e.isTreat && !e.deleted && Object.keys(computeShares(e)).includes(m.id)).reduce((a, e) => a + expBaseAmount(e), 0); return `<tr><td>${esc(m.name)}</td><td class="num">${money(paidBy[m.id] || 0, t.currency)}</td><td class="num">${money(shareBy[m.id] || 0, t.currency)}</td><td class="num ${(bal[m.id] || 0) > 50 ? 'pos' : (bal[m.id] || 0) < -50 ? 'neg' : ''}">${money(bal[m.id] || 0, t.currency)}</td><td class="num">${money(tg, t.currency)}</td><td class="num">${money(tr, t.currency)}</td></tr>`; }).join('')}</table></div>
      </div>
      ${days.length ? `<div class="card"><h3>Day-wise timeline</h3><div class="tablewrap"><table><tr><th>Date</th><th class="num">Spent</th><th class="num">Running total</th></tr>${(() => { let run = 0; return days.map(d => { run += perDay[d]; return `<tr><td>${esc(fmtDate(d))}</td><td class="num">${money(perDay[d], t.currency)}</td><td class="num">${money(run, t.currency)}</td></tr>`; }).join(''); })()}</table></div></div>` : ''}

  // ---------------- Charts (SVG) ----------------
  function pieSVG(data) {
    const total = data.reduce((a, d) => a + d.value, 0) || 1;
    const CX = 110, CY = 110, R = 92; let a0 = -Math.PI / 2, paths = '';
    data.forEach(d => { const a1 = a0 + (d.value / total) * Math.PI * 2; const large = (a1 - a0) > Math.PI ? 1 : 0;
      const x0 = CX + R * Math.cos(a0), y0 = CY + R * Math.sin(a0), x1 = CX + R * Math.cos(a1), y1 = CY + R * Math.sin(a1);
      paths += `<path d="M${CX},${CY} L${x0.toFixed(1)},${y0.toFixed(1)} A${R},${R} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${d.color}"/>`;
      a0 = a1; });
    return `<svg viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Spend by category"><title>Spend by category</title>${paths}<circle cx="${CX}" cy="${CY}" r="52" fill="var(--panel)"/><text x="${CX}" y="${CY - 2}" text-anchor="middle" font-size="12" fill="var(--muted)">total</text><text x="${CX}" y="${CY + 15}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)">${data.length} cat.</text></svg>`;
  }
  function barSVG(data) {
    const W = 360, H = 200, pad = 30, n = Math.max(1, data.length);
    const max = Math.max(1, ...data.map(d => d.value));
    const bw = (W - pad * 2) / n * 0.6, gap = (W - pad * 2) / n;
    let bars = '';
    data.forEach((d, i) => { const h = (H - pad * 2) * (d.value / max); const x = pad + gap * i + (gap - bw) / 2; const y = H - pad - h;
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${PALETTE[i % PALETTE.length]}"/>
      <text x="${(x + bw / 2).toFixed(1)}" y="${H - pad + 14}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(String(d.label).slice(0, 8))}</text>`; });
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Paid versus share by member"><title>Paid versus share by member</title><line x1="${pad}" y1="${H - pad}" x2="${W - pad}" y2="${H - pad}" stroke="var(--line)"/>${bars}</svg>`;
  }
  function lineSVG(data) {
    const W = 360, H = 200, pad = 30, n = Math.max(1, data.length - 1);
    const max = Math.max(1, ...data.map(d => d.value));
    const px = (i) => pad + (W - pad * 2) * (n ? i / n : 0);
    const py = (v) => H - pad - (H - pad * 2) * (v / max);
    let pts = data.map((d, i) => `${px(i).toFixed(1)},${py(d.value).toFixed(1)}`).join(' ');
    let dots = data.map((d, i) => `<circle cx="${px(i).toFixed(1)}" cy="${py(d.value).toFixed(1)}" r="3" fill="var(--accent)"/>`).join('');
    let labels = data.map((d, i) => `<text x="${px(i).toFixed(1)}" y="${H - pad + 14}" text-anchor="middle" font-size="9" fill="var(--muted)">${esc(String(d.label).slice(5))}</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Spend over time"><title>Spend over time</title><line x1="${pad}" y1="${H - pad}" x2="${W - pad}" y2="${H - pad}" stroke="var(--line)"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${dots}${labels}</svg>`;
  }

        <summary style="cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600">One-time Supabase setup (tap to show the SQL)</summary>
        <p class="hint" style="margin:8px 0 6px">Run this once in your Supabase SQL editor. Safe to re-run — it only creates what's missing and replaces the access policies. Since sign-up is now open to anyone with the link, this scopes access so a new account can only read/write the room it belongs to:</p>
        <pre style="background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px;line-height:1.5;overflow-x:auto;white-space:pre;margin:6px 0 10px;color:var(--text)">create table if not exists tripsplit_sync (room text primary key, data jsonb, updated_at timestamptz);
create table if not exists tripsplit_roles (room text, user_id uuid, email text, role text, created_at timestamptz default now(), primary key (room, user_id));
create table if not exists tripsplit_feed (id bigint generated always as identity primary key, room text, user_id uuid, email text, payload jsonb, created_at timestamptz default now());

alter table tripsplit_sync enable row level security;
alter table tripsplit_roles enable row level security;
alter table tripsplit_feed enable row level security;

drop policy if exists "auth only" on tripsplit_sync;
drop policy if exists "auth only" on tripsplit_roles;
drop policy if exists "auth only" on tripsplit_feed;
drop policy if exists "members access sync" on tripsplit_sync;
drop policy if exists "members read sync" on tripsplit_sync;
drop policy if exists "admin writes sync" on tripsplit_sync;
drop policy if exists "admin updates sync" on tripsplit_sync;
drop policy if exists "admin deletes sync" on tripsplit_sync;
drop policy if exists "self enroll as viewer" on tripsplit_roles;
drop policy if exists "read own role or admin reads room" on tripsplit_roles;
drop policy if exists "admin updates roles in their room" on tripsplit_roles;
drop policy if exists "admin removes people from their room" on tripsplit_roles;
drop policy if exists "members can submit to feed" on tripsplit_feed;
drop policy if exists "admin reads feed" on tripsplit_feed;
drop policy if exists "admin deletes feed" on tripsplit_feed;

create policy "members read sync" on tripsplit_sync for select
  using (exists (select 1 from tripsplit_roles r where r.room = tripsplit_sync.room and r.user_id = auth.uid()));

create policy "admin writes sync" on tripsplit_sync for insert
  with check (exists (select 1 from tripsplit_roles r where r.room = tripsplit_sync.room and r.user_id = auth.uid() and r.role = 'admin'));

create policy "admin updates sync" on tripsplit_sync for update
  using (exists (select 1 from tripsplit_roles r where r.room = tripsplit_sync.room and r.user_id = auth.uid() and r.role = 'admin'));

create policy "admin deletes sync" on tripsplit_sync for delete
  using (exists (select 1 from tripsplit_roles r where r.room = tripsplit_sync.room and r.user_id = auth.uid() and r.role = 'admin'));

create policy "self enroll as viewer" on tripsplit_roles for insert
  with check (user_id = auth.uid() and role = 'viewer');

create policy "read own role or admin reads room" on tripsplit_roles for select
  using (user_id = auth.uid() or exists (select 1 from tripsplit_roles me where me.room = tripsplit_roles.room and me.user_id = auth.uid() and me.role = 'admin'));

create policy "admin updates roles in their room" on tripsplit_roles for update
  using (exists (select 1 from tripsplit_roles me where me.room = tripsplit_roles.room and me.user_id = auth.uid() and me.role = 'admin'));

create policy "admin removes people from their room" on tripsplit_roles for delete
  using (exists (select 1 from tripsplit_roles me where me.room = tripsplit_roles.room and me.user_id = auth.uid() and me.role = 'admin'));

create policy "members can submit to feed" on tripsplit_feed for insert

create policy "admin reads feed" on tripsplit_feed for select
  using (exists (select 1 from tripsplit_roles r where r.room = tripsplit_feed.room and r.user_id = auth.uid() and r.role = 'admin'));

create policy "admin deletes feed" on tripsplit_feed for delete
  using (exists (select 1 from tripsplit_roles r where r.room = tripsplit_feed.room and r.user_id = auth.uid() and r.role = 'admin'));</pre>

  function viewTools(t) {

  function parseAlerts(text) {
    const out = [];
    String(text || '').split(/\n+/).forEach(line => {
      const L = line.trim(); if (!L) return;
      const am = L.match(/(?:rs\.?|inr|₹)\s*([0-9][0-9,]*\.?[0-9]*)/i) || L.match(/([0-9][0-9,]*\.?[0-9]*)\s*(?:debited|spent|paid|sent|withdrawn)/i);
      if (!am) return;
      const amount = toPaise(parseFloat(am[1].replace(/,/g, '')));
      if (!amount) return;
      let merchant = '';
      const mm = L.match(/\b(?:to|at|towards|for)\s+([A-Za-z0-9 .&@_-]{2,40})/i);
      if (mm) merchant = mm[1].replace(/\s+(on|dated|ref|upi|vpa).*$/i, '').trim();
      let date = todayISO();
      const dm = L.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
      if (dm) { const y = dm[3].length === 2 ? '20' + dm[3] : dm[3]; date = y + '-' + String(dm[2]).padStart(2, '0') + '-' + String(dm[1]).padStart(2, '0'); }
      out.push({ amount, merchant: merchant || 'Bank alert', date, raw: L });
    });
    return out;
  }

  function quickAddExpense() {

  function parseQuick(text, t) {
    const m = text.match(/(?:₹|rs\.?|inr)?\s*(-?[0-9][0-9,]*\.?[0-9]*)/i);
    if (!m) return null;
    const amount = toPaise(parseFloat(m[1].replace(/,/g, '')));
    if (!amount) return null;
    const lower = ' ' + text.toLowerCase() + ' ';
    const live = activeMembers(t, todayISO());
    const first = (x) => String(x.name).toLowerCase().split(/\s+/)[0];
    // payer: "Rohan paid", "paid by Rohan", "Rohan ne diya"
    let payer = '';
    const pm = text.match(/([A-Za-z][A-Za-z.'-]{1,22}?)\s+(?:paid|pay|ne diya|ne pay kiya|ne kharch)/i) || text.match(/(?:paid by|by)\s+([A-Za-z][A-Za-z.'-]{1,22})/i);
    if (pm) { const c = live.filter(x => first(x) === pm[1].trim().toLowerCase().split(/\s+/)[0]); if (c.length) payer = c[0].id; }
    if (!payer) { const last = (S.settings.lastPayer || {})[t.id]; payer = (last && memberById(t, last) && !memberById(t, last).deleted) ? last : (live[0] || {}).id; }
    // participants
    let participants;
    const justMe = /\b(just me|mujhe|mera|sirf main|only me|for myself)\b/.test(lower);
    const allRe = /\b(sab|sabhi|all|everyone|sabke|sab ke liye|everybody)\b/.test(lower);

    let title = text.replace(m[0], ' ')
      .replace(/\b(paid by|paid|split with|split|between|among|with|for|ne diya|ne pay kiya|ne kharch)\b/ig, ' ')
      .replace(/\b(sab ke liye|sabke liye|sab|sabhi|all|everyone|just me|mujhe|mera|only me|sirf main)\b/ig, ' ')

  function updateSplitInfo() {
    const t = trip(); const e = M.exp; const info = $('#splitInfo'); if (!info) return;
    syncDraft();
    const shares = computeShares(e);
    const sum = Object.values(shares).reduce((a, b) => a + b, 0);
    let warn = '';

  function syncDraft() {

  function saveExpense() {
    const t = trip(); syncDraft(); const e = M.exp;
    if (!e.title.trim()) { toast('Add a title'); return; }
    if (e.amount === 0) { toast('Enter an amount (negative is allowed for a refund)'); return; }
    if (e.currency !== t.currency && (!e.fxRate || e.fxRate <= 0)) { toast('Enter the exchange rate for ' + e.currency); return; }
    // normalize payers
    if (!e.fromPool) {
      e.payers = (e.payers && e.payers.length ? e.payers : [{ memberId: (liveMembers(t)[0] || {}).id, amount: e.amount }]);
      if (e.payers.length === 1 && e.payers[0].amount === 0) e.payers[0].amount = e.amount;
    } else { e.payers = []; }
    if (e.splitMode === 'equal' && !e.participants.length) { toast('Select at least one person to share'); return; }
    if (e.splitMode === 'exact') { const s = Object.values(computeShares(e)).reduce((a, b) => a + b, 0); if (s !== e.amount) { toast('Exact amounts must add up to the total (' + money(s, e.currency) + ')'); return; } }
    if (e.splitMode === 'percent') { const s = (e.shares || []).reduce((a, x) => a + clampNum(x.value), 0); if (Math.abs(s - 100) > 0.001) { toast('Percentages must add up to 100% (now ' + s + '%)'); return; } }
    if (e.splitMode === 'weight') { const s = (e.shares || []).reduce((a, x) => a + clampNum(x.value), 0); if (s <= 0) { toast('Enter shares/weights for the split'); return; } }
    if (e.splitMode === 'item') {
      const items = e.items || [];
      if (!items.length) { toast('Add at least one item'); return; }
      if (items.some(it => !(it.memberIds || []).length)) { toast('Every item needs at least one person'); return; }
      const s = items.reduce((a, it) => a + Math.round(clampNum(it.amount)), 0);
      if (s !== e.amount) { toast('Items must add up to the total (' + money(s, e.currency) + ' vs ' + money(e.amount, e.currency) + ')'); return; }
    }
    if (!e.fromPool && e.payers.length > 1) { const s = e.payers.reduce((a, p) => a + Math.round(p.amount), 0); if (s !== e.amount) { toast('Payers must add up to the total (' + money(s, e.currency) + ')'); return; } }
    if (role() === 'contributor') { if (e.id) { toast('Ask the admin to edit this expense'); return; } feedSubmit(e).then(ok => { if (ok) { closeModal(); render(); } }); return; }
    e.updatedAt = Date.now();
    if (M.receiptDataUrl) { if (!e.receiptId) e.receiptId = uid(); blobPut(e.receiptId, M.receiptDataUrl).catch(() => toast('Could not save the receipt image')); }
    if (!e.fromPool && e.payers[0] && e.payers[0].memberId) { S.settings.lastPayer = S.settings.lastPayer || {}; S.settings.lastPayer[t.id] = e.payers[0].memberId; }
    if (!e.id) { e.id = uid(); t.expenses.push(e); logAction(t, 'Added expense', e.title, e.id); } else { const i = t.expenses.findIndex(x => x.id === e.id); t.expenses[i] = e; logAction(t, 'Edited expense', e.title, e.id); }
    saveState(); closeModal(); render(); toast('Expense saved');
  }

  function handleReceiptFile(ev) {

    const r = new FileReader();
    r.onload = () => { if (!M) return; M.receiptDataUrl = r.result; const th = $('#receiptThumb'); if (th) th.innerHTML = `<img src="${r.result}" style="max-height:64px;border-radius:8px;border:1px solid var(--line)">`; const nm = $('#receiptName'); if (nm) nm.textContent = 'attached'; };

  function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = () => res(); s.onerror = () => rej(new Error('load')); document.head.appendChild(s); }); }
  async function ocrReceipt() {
    if (!M || !M.receiptDataUrl) { toast('Attach a receipt photo first'); return; }
    toast('Scanning receipt…');
    try {
      if (!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
      const out = await window.Tesseract.recognize(M.receiptDataUrl, 'eng');
      const text = (out && out.data && out.data.text) || ''; M.receiptText = text;
      const nums = (text.match(/\d[\d,]*\.?\d*/g) || []).map(s => parseFloat(s.replace(/,/g, ''))).filter(n => n > 0);
      if (nums.length) { const amt = Math.max.apply(null, nums); const el = $('#eAmount'); if (el) { el.value = amt; el.dispatchEvent(new Event('input', { bubbles: true })); } toast('Amount detected: ' + amt); }
      else toast('No amount found — enter it manually');
    } catch (e) { toast('OCR needs internet — enter amount manually'); }
  }

    debts.slice(0, 12).forEach(d => {
      x.fillStyle = '#1d1d1f'; x.font = '32px -apple-system,Segoe UI,Roboto,sans-serif'; x.fillText(`${mname(t, d.from)}  →  ${mname(t, d.to)}`, 50, y);
      x.fillStyle = '#c8102e'; x.font = 'bold 36px -apple-system,Segoe UI,Roboto,sans-serif'; x.textAlign = 'right'; x.fillText(money(d.amount, t.currency), W - 50, y); x.textAlign = 'left';
      x.strokeStyle = '#ececee'; x.beginPath(); x.moveTo(50, y + 24); x.lineTo(W - 50, y + 24); x.stroke();
      y += 68;
    });
    x.fillStyle = '#a1a1a6'; x.font = '22px -apple-system,Segoe UI,Roboto,sans-serif'; x.fillText('Made with TripSplit · ' + t.members.filter(m => !m.deleted).length + ' travellers', 50, H - 46);
    c.toBlob(async (blob) => {
      const file = new File([blob], `${t.name}-split.png`, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: t.name, text: 'Trip split' }); return; } catch (e) {} }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${t.name.replace(/\s+/g, '-')}-split.png`; a.click(); toast('Share card downloaded');
    }, 'image/png');
  }

  // ---------------- Events ----------------
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    if (act === 'closeModal') { closeModal(); return; }
    if (b.closest('.overlay') && ev.target.hasAttribute('data-overlay')) { closeModal(); return; }
    ev.preventDefault(); handle(act, b.dataset, b);
  });
  document.addEventListener('input', (ev) => {
    if (ev.target.id === 'fltQ') { expFilter.q = ev.target.value; clearTimeout(_fltT); _fltT = setTimeout(() => { render(); const el = $('#fltQ'); if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} } }, 180); return; }
    if (M && ev.target.closest('.modal')) { if (ev.target.matches('[data-share],[data-item-amt],[data-payer-amt],#eAmount')) updateSplitInfo(); else syncDraft(); }
  });
  document.addEventListener('change', (ev) => {
    if (ev.target.id === 'fltCat') { expFilter.cat = ev.target.value; render(); return; }
    if (ev.target.dataset && ev.target.dataset.act === 'setRole') { setPersonRole(ev.target.dataset.uid, ev.target.value); return; }
    if (ev.target.id === 'fltMem') { expFilter.member = ev.target.value; render(); const el = $('#fltMem'); if (el) el.focus(); return; }
    if (ev.target.id === 'ntTemplate') { applyTemplate(ev.target.value); return; }
    if (M && ev.target.closest('.modal')) {
      if (ev.target.id === 'ePool') { syncDraft(); renderPayers(); updateSplitInfo(); return; }
      if (ev.target.id === 'eDate') { syncDraft(); renderSplit(); return; }
      if (ev.target.id === 'eCur') { syncDraft(); expenseModal(); return; }
      if (ev.target.id === 'eReceipt') { handleReceiptFile(ev); return; }
      if (ev.target.matches('[data-part]')) { syncDraft(); updateSplitInfo(); return; }
      syncDraft();
    }
  });
  document.addEventListener('change', (ev) => { if (ev.target.id === 'asOf' && trip()) { asOfDate = ev.target.value; render(); const el = $('#asOf'); if (el) el.focus(); } });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') closeModal();
    if (ev.key === 'Tab') { const ov = $('.overlay'); if (ov) { const f = ov.querySelectorAll('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])'); if (f.length) { const first = f[0], last = f[f.length - 1]; if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); } else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); } } } }
    const mod = ev.metaKey || ev.ctrlKey;
    if (mod && ev.key.toLowerCase() === 'n') { ev.preventDefault(); if (trip()) newExpense(); }
    else if (mod && ev.key.toLowerCase() === 'f') { ev.preventDefault(); if (view !== 'expenses') { view = 'expenses'; render(); } setTimeout(() => { const el = $('#quickAdd') || $('#fltQ'); if (el) el.focus(); }, 40); }
    else if (mod && ev.key.toLowerCase() === 's') { ev.preventDefault(); view = 'balances'; render(); }
    else if (mod && ev.key.toLowerCase() === 'r') { ev.preventDefault(); view = 'reports'; render(); }
    else if (mod && ev.key.toLowerCase() === 'b') { ev.preventDefault(); if (role() !== 'admin') { toast('Admins only'); } else { view = 'data'; render(); } }
    else if (mod && ev.key.toLowerCase() === 't') { ev.preventDefault(); if (trip()) tripSheet(); }
    else if (ev.key === '?' && trip() && !/^(INPUT|TEXTAREA|SELECT)$/.test(((document.activeElement || {}).tagName) || '') && !(document.activeElement && document.activeElement.isContentEditable)) { ev.preventDefault(); shortcutsSheet(); }
  });

  // ---------------- Init ----------------
  (async function init() {
    await loadState();
    if (!S.settings.activeTripId && S.trips[0]) S.settings.activeTripId = S.trips[0].id;
    const t0 = trip(); if (t0 && materializeRecurring(t0)) saveState();
    try { const h = await idbGet('syncFileHandle'); if (h) syncFileHandle = h; } catch (e) {}
    try {
      const _q = new URLSearchParams(location.search);
      let _cfg = null;
      if (_q.get('c')) { try { _cfg = JSON.parse(decodeURIComponent(escape(atob(_q.get('c'))))); } catch (e) {} }
      else if (_q.get('url') || _q.get('key') || _q.get('room')) { _cfg = { url: _q.get('url') || '', key: _q.get('key') || '', room: _q.get('room') || '' }; }
      if (_cfg && (_cfg.url || _cfg.key || _cfg.room)) { S.settings.sync = Object.assign({}, S.settings.sync || {}, _cfg); saveState(); }
    } catch (e) {}
    if (window.__TRIPSPLIT_CFG__ && (!S.settings.sync || !S.settings.sync.url)) { S.settings.sync = window.__TRIPSPLIT_CFG__; saveState(); }
    if (S.settings.session) { AUTH.session = S.settings.session; }
    render();
    if (AUTH.session && supaReady()) { try { await fetchRole(); if (role() === 'admin') await fetchFeed(); else { const ok = await pullShared(true); if (ok) toast('Loaded the shared trip'); } render(); } catch (e) {} }
  })();

})();

</script>
</body>
</html>
